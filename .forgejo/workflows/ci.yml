name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        run: corepack enable
      - name: check
        run: pnpm check
      - name: test
        run: pnpm test
      - name: pack check
        run: pnpm pack:check
